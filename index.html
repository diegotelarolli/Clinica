  $('#ntr').onclick = () => novoTreino();
  const q = $('#tq'); q.oninput = () => { u.q = q.value; clearTimeout(S.ui.tt); S.ui.tt = setTimeout(()=>{ rerender(); const n=$('#tq'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); }, 250); };
  $('#tp').onchange = e => { u.prot = e.target.value; rerender(); };
}
function vTreinoEdit(id){
  const novo = id==='novo';
  const t = novo ? S.ui.treinoNovo : JSON.parse(JSON.stringify(treino(id)||null));
  if(!t){ location.hash = '#/treinos'; return; }
  t.vinculo ||= t.protocoloId ? 'existente' : 'sem';
  const prots = protocolos();
  const draw = () => {
    const pr = protocolo(t.protocoloId);
    page(`<a href="#/treinos" style="text-decoration:none">← Exercícios & Treinos</a>`, novo?'Novo treino':'Editar treino', `${!novo&&can.admin()?`<button class="btn danger" id="tdel">${ic('trash')} Excluir</button>`:''}<button class="btn" id="tdup" ${novo?'hidden':''}>${ic('copy')} Duplicar</button><button class="btn pri" id="tsave">${ic('check')} Salvar treino</button>`,
     `<div class="card"><div class="form">
        <div class="f"><label>Nome do treino — objetivo da sessão do dia *</label><input type="text" id="tnome" value="${h(t.nome)}" placeholder="Ex.: Ganho de extensão e ativação de quadríceps" style="font-size:16px;font-weight:600"></div>
        <div class="f"><label>Vínculo com protocolo</label><div class="seg" id="tvinc">${[['existente','Protocolo existente'],['novo','Abrir novo protocolo'],['sem','Sem protocolo']].map(([k,l])=>`<button type="button" data-v="${k}" class="${t.vinculo===k?'on':''}">${l}</button>`).join('')}</div></div>
        ${t.vinculo==='existente'?`<div class="f c8"><label>Protocolo</label><select id="tprot"><option value="">Selecione…</option>${prots.map(p=>`<option value="${p.id}" ${t.protocoloId===p.id?'selected':''}>${h(p.nome)}</option>`).join('')}</select></div>
          <div class="f c4"><label>Fase</label><select id="tfase" ${pr?'':'disabled'}>${(pr?.fases||[]).map((f,i)=>`<option value="${i}" ${+t.fase===i?'selected':''}>${h(f.nome)}${f.objetivo?' — '+h(f.objetivo.slice(0,40)):''}</option>`).join('')}</select></div>`:''}
        ${t.vinculo==='novo'?`<div class="f c8"><label>Nome do novo protocolo</label><input type="text" id="tnprot" value="${h(t.novoProtNome||'')}" placeholder="Ex.: Lombalgia inespecífica"></div><div class="f c4 tiny" style="justify-content:flex-end">O protocolo é criado com 5 fases e este treino entra na Fase 1. Depois complete os dados em Protocolos.</div>`:''}
        ${t.vinculo==='sem'?`<div class="f tiny">Treino avulso: fica disponível para qualquer paciente em "Usar outro treino".</div>`:''}
      </div></div>
      <div class="card"><div class="card-h"><h3>Exercícios</h3><span class="tiny">${exercicios().length.toLocaleString('pt-BR')} exercícios na biblioteca</span></div><div id="tEx"></div></div>
      <div class="card"><div class="card-h"><h3>Condutas clínicas</h3><span class="tiny">Recursos terapêuticos e terapia manual — clique para incluir e informe região e parâmetros</span></div><div id="tCd"></div></div>
      <div class="card"><div class="card-h"><h3>Condutas educacionais</h3></div><div id="tEd"></div></div>
      <div class="card"><div class="form">${fld('Observações para a equipe','tobs',t.obs,{type:'textarea',cls:'',rows:2,attrs:'id="tobs"'})}</div></div>`);
    exEditor($('#tEx'), t.exercicios); condEditor($('#tCd'), t.condutas); eduEditor($('#tEd'), t);
    $('#tnome').oninput = e => t.nome = e.target.value;
    $('#tobs').oninput = e => t.obs = e.target.value;
    $$('#tvinc button').forEach(b=>b.onclick=()=>{ t.vinculo = b.dataset.v; if(t.vinculo!=='existente'){ t.protocoloId=''; t.fase=0; } draw(); });
    $('#tprot') && ($('#tprot').onchange = e => { t.protocoloId = e.target.value; t.fase = 0; draw(); });
    $('#tfase') && ($('#tfase').onchange = e => t.fase = +e.target.value);
    $('#tnprot') && ($('#tnprot').oninput = e => t.novoProtNome = e.target.value);
    $('#tsave').onclick = async () => {
      if(!t.nome.trim()){ toast('Todo treino precisa de um nome (objetivo da sessão)', true); $('#tnome').focus(); return; }
      if(t.vinculo==='existente' && !t.protocoloId){ toast('Escolha o protocolo ou marque "Sem protocolo"', true); return; }
      if(t.vinculo==='novo'){ if(!t.novoProtNome?.trim()){ toast('Informe o nome do novo protocolo', true); return; } const np = novoProtocoloObj(t.novoProtNome.trim()); await saveProts([...protocolos(), np], 'Protocolo criado'); t.protocoloId = np.id; t.fase = 0; }
      const rec = { id:t.id, nome:t.nome.trim(), protocoloId:t.protocoloId||'', fase:+t.fase||0, exercicios:t.exercicios, condutas:t.condutas, educacao:t.educacao||[], educacaoObs:t.educacaoObs||'', obs:t.obs||'', atualizadoEm:today() };
      const itens = treinos().filter(x=>x.id!==rec.id); itens.push(rec);
      await save('config/treinos', {itens}, 'Treino salvo');
      location.hash = rec.protocoloId ? '#/protocolos/'+rec.protocoloId : '#/treinos';
    };
    $('#tdup') && ($('#tdup').onclick = () => { const c = JSON.parse(JSON.stringify(t)); c.id = uid(); c.nome += ' (cópia)'; S.ui.treinoNovo = c; location.hash = '#/treino/novo'; });
    $('#tdel') && ($('#tdel').onclick = async () => { if(!confirm('Excluir este treino?')) return; await save('config/treinos', {itens:treinos().filter(x=>x.id!==t.id)}, 'Treino excluído'); location.hash = '#/treinos'; });
  };
  draw();
}
function vBiblioteca(tabs){
  const all = exercicios(); const u = S.ui.ex ||= { q:'', r:'', c:'', lim:100 };
  const cats = [...new Set(all.map(e=>e.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt'));
  const regs = [...new Set(all.filter(e=>!u.c||e.categoria===u.c).map(e=>e.regiao).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt'));
  const q = u.q.toLowerCase();
  let l = all.filter(e=>(!u.c||e.categoria===u.c) && (!u.r||e.regiao===u.r) && (!q || (e.nome+' '+(e.objetivo||'')+' '+(e.equipamento||'')+' '+e.categoria+' '+e.regiao+' '+e.id).toLowerCase().includes(q)));
  page('Sessões padronizadas', 'Exercícios & Treinos', `<button class="btn" id="imp">Importar (JSON/CSV)</button><button class="btn pri" id="nex">${ic('plus')} Novo exercício</button>`,
   `${tabs}<div class="card"><div class="card-h"><div class="btns" style="flex:1"><input type="search" id="exq" placeholder="Buscar por nome, objetivo, equipamento ou código…" value="${h(u.q)}" style="max-width:320px">
      <select id="exc" style="width:auto;max-width:240px"><option value="">Todas as abas (${cats.length})</option>${cats.map(r=>`<option ${u.c===r?'selected':''}>${h(r)}</option>`).join('')}</select>
      <select id="exr" style="width:auto;max-width:220px"><option value="">Todas as regiões</option>${regs.map(r=>`<option ${u.r===r?'selected':''}>${h(r)}</option>`).join('')}</select></div><span class="tiny">${l.length.toLocaleString('pt-BR')} de ${all.length.toLocaleString('pt-BR')}</span></div>
    <div class="tablewrap"><table><thead><tr><th>Exercício</th><th>Aba</th><th class="hide-m">Região</th><th class="hide-m">Equipamento</th><th class="hide-m">Nível</th><th>Vídeo</th></tr></thead><tbody>
    ${l.slice(0,u.lim).map(e=>`<tr class="click" data-ex="${h(e.id)}"><td><b>${h(e.nome)}</b><div class="tiny">${h(e.id)}${e.objetivo?' · '+h(e.objetivo):''}</div></td><td class="small">${h(e.categoria)}</td><td class="hide-m small">${h(e.regiao)}</td><td class="hide-m small">${h(e.equipamento||'')}</td><td class="hide-m tiny">${h((e.nivel||'').length<28?e.nivel:'Aplicação clínica')}</td><td>${e.video?`<a href="${h(e.video)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${ic('video',16)}</a>`:'<span class="tiny">—</span>'}</td></tr>`).join('')}
    </tbody></table></div>${l.length>u.lim?`<div style="text-align:center;margin-top:10px"><button class="btn" id="more">Mostrar mais</button></div>`:''}</div>`);
  const qi = $('#exq'); qi.oninput = () => { u.q = qi.value; u.lim=100; clearTimeout(S.ui.et); S.ui.et = setTimeout(()=>{ rerender(); const n=$('#exq'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); },250); };
  $('#exc').onchange = e => { u.c = e.target.value; u.r=''; u.lim=100; rerender(); };
  $('#exr').onchange = e => { u.r = e.target.value; u.lim=100; rerender(); };
  $('#more') && ($('#more').onclick = () => { u.lim += 200; rerender(); });
  $('#nex').onclick = () => editExercicio();
  $$('[data-ex]').forEach(r=>r.onclick=()=>editExercicio(all.find(e=>e.id===r.dataset.ex)));
  $('#imp').onclick = importarExercicios;
}
function editExercicio(e){
  const novo = !e; e = e || {};
  const all = exercicios();
  modal(novo?'Novo exercício':'Exercício', `<div class="form">${e.id&&!novo?`<div class="f tiny">Código ${h(e.id)}${e.base?' · biblioteca padrão (as edições ficam salvas só para a clínica)':''}</div>`:''}
    ${fld('Nome','nome',e.nome,{cls:''})}${fld('Aba (tipo de exercício)','categoria',e.categoria,{cls:'c6',attrs:'list="dl_cat"'})}${fld('Região','regiao',e.regiao,{cls:'c6',attrs:'list="dl_reg"'})}
    ${fld('Objetivo','objetivo',e.objetivo,{cls:'c6'})}${fld('Principal capacidade','capacidade',e.capacidade,{cls:'c6'})}
    ${fld('Equipamento','equipamento',e.equipamento,{cls:'c4'})}${fld('Nível','nivel',e.nivel,{cls:'c4'})}${fld('Contexto','contexto',e.contexto,{cls:'c4'})}
    ${fld('Link do vídeo','video',e.video,{type:'url',cls:'',ph:'https://…'})}${fld('Observações / dicas de execução','obs',e.obs,{type:'textarea',cls:'',rows:3})}
    ${e.video?`<div class="f"><a href="${h(e.video)}" target="_blank" rel="noopener" class="btn sm" style="width:max-content">${ic('video',14)} Abrir vídeo</a></div>`:''}
    <datalist id="dl_reg">${[...new Set(all.map(x=>x.regiao))].map(x=>`<option>${h(x)}</option>`).join('')}</datalist><datalist id="dl_cat">${[...new Set(all.map(x=>x.categoria))].map(x=>`<option>${h(x)}</option>`).join('')}</datalist></div>`,
   { wide:true, onSave: async v => { if(!v.nome){ toast('Informe o nome', true); return false; } const base = e.id ? {...e} : {id:uid()}; delete base.base; await saveExercicio({...base, ...v}); rerender(); },
     danger: novo||!can.admin()?null:{ label:'Remover da biblioteca', fn: async()=>{ await saveExercicio(e, true); rerender(); } } });
}

/* ============================ CONFIGURAÇÕES ============================ */
function vConfig(){
  const cl = clinica();
  page('Administração', 'Configurações', '', `<div class="card"><form class="form" id="cf">
    ${sec('Dados da clínica (aparecem nos PDFs e mensagens)')}
    ${fld('Nome','nome',cl.nome,{cls:'c8'})}${fld('Telefone','telefone',cl.telefone,{cls:'c4'})}
    ${fld('Endereço','endereco',cl.endereco,{cls:''})}
    ${fld('Frase de rodapé','slogan',cl.slogan,{cls:''})}
    ${sec('Padrões')}
    ${fld('Valor padrão da sessão (R$)','valorSessao',cl.valorSessao,{type:'number',step:'0.01',cls:'c4'})}
    ${fld('Desconto à vista padrão (%)','descontoVista',cl.descontoVista,{type:'number',cls:'c4'})}
    ${fld('Duração padrão da sessão (min)','duracaoSessao',cl.duracaoSessao,{type:'number',cls:'c4'})}
    <div class="f"><label class="chk"><input type="checkbox" name="faltaConsome" ${cl.faltaConsome?'checked':''}> Falta não justificada consome sessão do pacote</label></div>
    ${sec('Mensagens de WhatsApp')}
    ${fld('Chave Pix (entra nas mensagens de cobrança)','chavePix',cl.chavePix,{cls:'c6'})}
    <div class="f c6 tiny" style="justify-content:flex-end">Campos disponíveis: {nome} {parcela} {valor} {vencimento} {pix} {clinica} · confirmação: {nome} {dia} {hora} {fisio} {clinica}</div>
    ${fld('Lembrete de parcela a vencer','msgLembrete',cl.msgLembrete,{type:'textarea',cls:'',rows:3})}
    ${fld('Cobrança de parcela vencida','msgCobranca',cl.msgCobranca,{type:'textarea',cls:'',rows:3})}
    ${fld('Confirmação de sessão','msgConfirmacao',cl.msgConfirmacao,{type:'textarea',cls:'',rows:2})}
    <div class="f"><button class="btn pri" type="submit" style="justify-self:start;width:max-content">Salvar configurações</button></div>
   </form></div>
   <div class="card"><h3>Backup</h3><p class="small muted">Baixe uma cópia completa dos dados (JSON). Recomendado uma vez por semana.</p><div class="btns"><button class="btn" id="bk">Baixar backup</button></div></div>`);
  $('#cf').onsubmit = async e => { e.preventDefault(); const v = formData(e.target); await save('config/clinica', {...cl, ...v, valorSessao:+v.valorSessao||0, descontoVista:+v.descontoVista||0, duracaoSessao:+v.duracaoSessao||60}, 'Configurações salvas'); };
  $('#bk').onclick = () => { const data = { exportadoEm:new Date().toISOString(), documents:Object.fromEntries(S.docs), equipe:S.equipe }; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'})); a.download = `backup-clinica-${today()}.json`; a.click(); };
}

/* ============================ start ============================ */
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
