/* =====================================================================
   CONFIGURAÇÃO — cole aqui os dados do seu projeto Supabase
   (Supabase > Project Settings > API). Deixe vazio para rodar em MODO DEMO.

const CONFIG = {
  SUPABASE_URL: '',

};
const DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY;

/* ============================ utilidades ============================ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const h = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/-/g,'').slice(0,16);
const pad = n => String(n).padStart(2,'0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoDate(new Date());
const parseD = s => { if(!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return isoDate(d); };
const addMonths = (s, n) => { const d = parseD(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day,last)); return isoDate(d); };
const fmtD = s => { if(!s) return '—'; const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; };
const fmtDs = s => { if(!s) return '—'; const [,m,d] = s.split('-'); return `${d}/${m}`; };

const DB = {
  async loadAll(){
    if(DEMO){
      let d = lsGet(DEMO_KEY);
      if(!d){ d = demoSeed(); lsSet(DEMO_KEY, d); }
      S.equipe = d.equipe;
      return Object.entries(d.docs).map(([path,data])=>({path,data}));
    }
    const out = []; let from = 0; const step = 1000;
    while(true){
      const { data, error } = await sb.from('documents').select('path,data').range(from, from+step-1);
      if(error) throw error;
      out.push(...data); if(data.length < step) break; from += step;
    }
    const eq = await sb.from('equipe').select('*').order('nome');
    if(!eq.error) S.equipe = eq.data;
    return out;
  },
  async put(path, data){
    if(DEMO){ const d = lsGet(DEMO_KEY) || {docs:{}, equipe:S.equipe}; d.docs[path] = data; lsSet(DEMO_KEY, d); return; }
    const { error } = await sb.from('documents').upsert({ path, data });
    if(error) throw error;
  },
  async del(path){
    if(DEMO){ const d = lsGet(DEMO_KEY); if(d){ delete d.docs[path]; lsSet(DEMO_KEY, d); } return; }
    const { error } = await sb.from('documents').delete().eq('path', path);
    if(error) throw error;
  },
  async updMembro(id, patch){
    if(DEMO){ const d = lsGet(DEMO_KEY); const m = d.equipe.find(x=>x.id===id); Object.assign(m, patch); lsSet(DEMO_KEY, d); S.equipe = d.equipe; return; }
    const { error } = await sb.from('equipe').update(patch).eq('id', id);
    if(error) throw error;
    const eq = await sb.from('equipe').select('*').order('nome'); if(!eq.error) S.equipe = eq.data;
  }
};

  const clean = {...data}; delete clean.id;

  const old = S.docs.get(path); S.docs.delete(path);

/* -------- LSI / déficit entre membros -------- */
function lsiVal(row, p, menor){
  const d = num(row?.D), e = num(row?.E); if(d==null || e==null || !d || !e) return null;
  const les = p?.membroLesado;
  let lesado, saudavel;
  if(les==='Direito'){ lesado=d; saudavel=e; } else if(les==='Esquerdo'){ lesado=e; saudavel=d; }
  else return Math.min(d,e)/Math.max(d,e)*100;
  return menor ? saudavel/lesado*100 : lesado/saudavel*100;
}
const campoDef = (sec, k) => AV_SECOES.find(s=>s.k===sec)?.campos.find(c=>c.k===k);
function lsiOf(av, p, sec, campo, item){ const c = campoDef(sec, campo); const row = av?.dados?.[sec]?.[campo]?.[item]; return lsiVal(row, p, (c?.menor||[]).includes(item)); }
const lsiTxt = (av,p,sec,campo,item) => { const v = lsiOf(av,p,sec,campo,item); return v==null ? null : `LSI ${Math.round(v)}%`; };
const lsiOk = (av,p,sec,campo,item) => { const v = lsiOf(av,p,sec,campo,item); return v==null ? null : v>=90; };
const lsiPill = v => v==null ? '' : `<span class="pill ${v>=90?'ok':v>=80?'warn':'bad'}">${Math.round(v)}%</span>`;
const deficit = (d,e) => { d=num(d); e=num(e); if(d==null||e==null||Math.max(d,e)===0) return null; return Math.abs(d-e)/Math.max(d,e)*100; };

/* -------- presença / pacotes -------- */
const consome = s => s.status==='realizada' || (s.status==='falta' && clinica().faltaConsome);
function alocacao(pacId){
  const pk = sortBy(pacotes().filter(p=>p.pacienteId===pacId), p=>p.dataInicio||'');
  const ss = sortBy(sessoes().filter(s=>s.pacienteId===pacId && consome(s)), s=>s.data+(s.hora||''));
  const res = {}; pk.forEach(p=>res[p.id]={usadas:0, total:Number(p.sessoes)||0});
  let i = 0, fora = 0;
  for(const s of ss){
    while(i<pk.length && res[pk[i].id].usadas>=res[pk[i].id].total) i++;
    if(i>=pk.length || (pk[i].dataInicio && s.data < pk[i].dataInicio)){ fora++; continue; }
    res[pk[i].id].usadas++;
  }
  return { pacotes:pk, uso:res, semPacote:fora };
}
function saldoPaciente(pacId){
  const a = alocacao(pacId); let total=0, usadas=0;
  a.pacotes.filter(p=>p.status!=='encerrado').forEach(p=>{ total+=a.uso[p.id].total; usadas+=a.uso[p.id].usadas; });
  return { total, usadas, restantes: total-usadas, semPacote:a.semPacote, temPacote: a.pacotes.length>0 };
}
function parcelaStatus(p){ if(p.pago) return 'pago'; if(p.venc < today()) return 'atrasada'; return 'aberta'; }
function finPaciente(pacId){
  const a = alocacao(pacId); let contratado=0, pago=0, aberto=0, atrasado=0, sessCont=0, sessUsadas=0, sessPagas=0;
  const parcelas = [];
  a.pacotes.forEach(pk=>{
    const tot = +pk.total||0, n = +pk.sessoes||0; contratado += tot; sessCont += n; sessUsadas += a.uso[pk.id].usadas;
    const pg = (pk.parcelas||[]).filter(x=>x.pago).reduce((s,x)=>s+(+x.valor||0),0); pago += pg;
    sessPagas += tot>0 ? Math.min(n, Math.floor(pg/(tot/n)+1e-6)) : n;
    (pk.parcelas||[]).forEach((x,i)=>{ const st = parcelaStatus(x); if(st!=='pago'){ aberto += +x.valor||0; if(st==='atrasada') atrasado += +x.valor||0; } parcelas.push({...x, i, pk, st}); });
  });
  const realizadas = sessoes().filter(s=>s.pacienteId===pacId && consome(s)).length;
  return { contratado, pago, aberto, atrasado, sessCont, sessUsadas, sessPagas, realizadas, semPacote:a.semPacote, parcelas:sortBy(parcelas, x=>x.venc), pacotes:a.pacotes, uso:a.uso,
    naoPagas: Math.max(0, sessUsadas - sessPagas) + a.semPacote };
}
function frequencia(pacId, desde){
  const ss = sessoes().filter(s=>s.pacienteId===pacId && s.data<=today() && (!desde || s.data>=desde) && s.status!=='cancelada' && s.status!=='agendada');
  const pres = ss.filter(s=>s.status==='realizada').length, falt = ss.filter(s=>s.status==='falta').length, just = ss.filter(s=>s.status==='justificada').length;
  return { total:ss.length, pres, falt, just, pct: ss.length ? Math.round(pres/ss.length*100) : null };
}

/* -------- WhatsApp -------- */
function waNumero(tel){ let d = String(tel||'').replace(/\D/g,''); if(!d) return ''; if(d.length<=11) d = '55'+d.replace(/^0+/,''); return d; }
function waAbrir(tel, msg){
  const n = waNumero(tel);
  if(!n){ toast('Paciente sem telefone cadastrado', true); return false; }
  const url = `https://wa.me/${n}?text=${encodeURIComponent(msg)}`;
  const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
  return true;
}
function preencher(tpl, vars){ return String(tpl||'').replace(/\{(\w+)\}/g, (m,k)=> vars[k] ?? ''); }
function msgParcela(p, x, total){
  const cl = clinica(); const atras = parcelaStatus(x)==='atrasada';
  return preencher(atras ? cl.msgCobranca : cl.msgLembrete, { nome:p.nome.split(' ')[0], parcela:`${x.n||x.i+1}/${total}`, valor:brl(x.valor), vencimento:fmtD(x.venc), pix: cl.chavePix ? `Chave Pix: ${cl.chavePix}. ` : '', clinica: cl.nome.split('—')[0].trim() });
}
function msgConfirmacao(s){
  const p = paciente(s.pacienteId); const cl = clinica(); const d = parseD(s.data);
  const dia = s.data===today() ? 'hoje' : s.data===addDays(today(),1) ? 'amanhã' : `${DOW[d.getDay()].toLowerCase()}, ${fmtDs(s.data)}`;
  return preencher(cl.msgConfirmacao, { nome:p?.nome.split(' ')[0]||'', dia, hora:s.hora||'', fisio:membro(s.fisioId)?.nome?.split(' ')[0]||'nossa equipe', clinica:cl.nome.split('—')[0].trim() });
}
async function registrarLembrete(pkId, i){
  const pk = pacotes().find(x=>x.id===pkId); if(!pk) return;
  const ps = JSON.parse(JSON.stringify(pk.parcelas)); ps[i].lembretes = [...(ps[i].lembretes||[]), today()];
  await save('financeiro/'+pkId, {...pk, parcelas:ps});
}
async function enviarLembrete(pkId, i){
  const pk = pacotes().find(x=>x.id===pkId); const p = paciente(pk?.pacienteId); if(!p) return;
  const x = {...pk.parcelas[i], i};
  if(waAbrir(p.telefone, msgParcela(p, x, pk.parcelas.length))){ await registrarLembrete(pkId, i); rerender(); }
}
/* ============================ UI básica ============================ */
function toast(msg, err){ const t = document.createElement('div'); t.className = 'toast'+(err?' err':''); t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), err?5000:2200); }

function modal(title, body, { onSave, saveLabel='Salvar', wide=false, footer, onOpen, danger, stack=false } = {}){
  if(!stack) closeAllModals();
  const bg = document.createElement('div'); bg.className='modal-bg'; bg.style.zIndex = 50 + $$('.modal-bg').length;
  bg.innerHTML = `<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true"><div class="mh"><h2>${h(title)}</h2><button class="btn ghost sm" data-x aria-label="Fechar">✕</button></div>
    <form class="mb" id="mform" autocomplete="off">${body}</form>
    <div class="mf">${danger?`<button class="btn danger" data-del style="margin-right:auto">${h(danger.label||'Excluir')}</button>`:''}${footer ?? `<button class="btn" data-x type="button">Cancelar</button>${onSave?`<button class="btn pri" data-save type="button">${h(saveLabel)}</button>`:''}`}</div></div>`;
  document.body.appendChild(bg);
  bg.addEventListener('mousedown', e=>{ if(e.target===bg) bg.remove(); });
  $$('[data-x]', bg).forEach(b=>b.onclick = ()=>bg.remove());
  const form = $('#mform', bg);
  const doSave = async () => { const fd = formData(form); const r = await onSave(fd, form); if(r!==false) bg.remove(); };
  if(onSave){ const sv=$('[data-save]', bg); if(sv) sv.onclick = doSave; form.onsubmit = e=>{ e.preventDefault(); doSave(); }; }
  else form.onsubmit = e=>e.preventDefault();
  if(danger) $('[data-del]', bg).onclick = async ()=>{ if(confirm(danger.confirm||'Confirmar exclusão?')){ bg.remove(); await danger.fn(); } };
  const first = $('input:not([type=hidden]),select,textarea', form); if(first && window.innerWidth>820) first.focus();
  if(onOpen) onOpen(form, bg);
  return form;
}
function closeModal(){ const l = $$('.modal-bg'); l[l.length-1]?.remove(); }
function closeAllModals(){ $$('.modal-bg').forEach(x=>x.remove()); }
function formData(form){
  const o = {};
  $$('input,select,textarea', form).forEach(el=>{
    if(!el.name) return;
    if(el.type==='checkbox'){ if(el.dataset.multi){ (o[el.name] ||= []); if(el.checked) o[el.name].push(el.value); } else o[el.name] = el.checked; }
    else if(el.type==='radio'){ if(el.checked) o[el.name] = el.value; else if(!(el.name in o)) o[el.name] = null; }
    else o[el.name] = el.value.trim();
  });
  return o;
}
const fld = (label, name, val='', {type='text', cls='c6', opts, ph='', req, rows, step, attrs=''}={}) => {
  let input;
  if(opts) input = `<select name="${name}" ${attrs}>${opts.map(o=>{ const [v,l] = Array.isArray(o)?o:[o,o]; return `<option value="${h(v)}" ${String(v)===String(val??'')?'selected':''}>${h(l)}</option>`; }).join('')}</select>`;
  else if(type==='textarea') input = `<textarea name="${name}" rows="${rows||3}" placeholder="${h(ph)}" ${attrs}>${h(val)}</textarea>`;
  else input = `<input type="${type}" name="${name}" value="${h(val)}" placeholder="${h(ph)}" ${req?'required':''} ${step?`step="${step}"`:''} ${attrs}>`;
  return `<div class="f ${cls}"><label>${h(label)}</label>${input}</div>`;
};
const sec = t => `<div class="sec">${h(t)}</div>`;

/* ---------- gráfico de linha simples (SVG) ---------- */
function lineChart(points, { min=0, max, height=150, color='#111', yfmt=v=>v, ref, refLabel, invert=false } = {}){
  if(!points.length) return `<div class="empty small">Sem registros ainda</div>`;
  const W=600, H=height, pl=34, pr=12, pt=12, pb=24;
  const vals = points.map(p=>p.v); max = max ?? Math.max(...vals, 1); if(max===min) max = min+1;
  const x = i => pl + (points.length===1 ? (W-pl-pr)/2 : i*(W-pl-pr)/(points.length-1));
  const y = v => pt + (1-(v-min)/(max-min))*(H-pt-pb);
  const ticks = [min, (min+max)/2, max];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  ticks.forEach(t=>{ s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="#ececea"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${yfmt(Math.round(t))}</text>`; });
  if(ref!=null) s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(ref)}" y2="${y(ref)}" stroke="#9a6200" stroke-dasharray="4 4"/><text x="${W-pr}" y="${y(ref)-4}" text-anchor="end" style="fill:#9a6200">${h(refLabel||'')}</text>`;
  s+=`<polyline fill="none" stroke="${color}" stroke-width="2.2" points="${points.map((p,i)=>`${x(i)},${y(p.v)}`).join(' ')}"/>`;
  points.forEach((p,i)=>{ s+=`<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="${p.c||color}" stroke="#fff" stroke-width="1.5"><title>${h(p.l)}: ${p.v}</title></circle>`; });
  const every = Math.ceil(points.length/8);
  points.forEach((p,i)=>{ if(i%every===0||i===points.length-1) s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${h(p.l)}</text>`; });
  return `<div class="chart">${s}</svg></div>`;
}

  ['pacientes','Pacientes','users', ()=>true],
  ['agenda','Agenda','cal', ()=>true],
  ['presenca','Presença','check', ()=>true],
  ['financeiro','Financeiro','money', can.financeiro],
  ['protocolos','Protocolos','layers', can.clinico],
  ['treinos','Exercícios & Treinos','dumbbell', can.clinico],
  ['equipe','Equipe','team', ()=>true],
  ['config','Configurações','gear', can.admin]
];
const VIEWS = () => ({ inicio:vInicio, pacientes:vPacientes, paciente:vPaciente, avaliacao:vAvaliacao, agenda:vAgenda, presenca:vPresenca, financeiro:vFinanceiro, protocolos:vProtocolos, treinos:vTreinos, treino:vTreinoEdit, exercicios:vTreinos, equipe:vEquipe, config:vConfig });
const NAVMAP = { paciente:'pacientes', avaliacao:'pacientes', treino:'treinos', exercicios:'treinos' };
function startApp(){
  $('#root').innerHTML = `
  <div class="mobilebar"><button id="mb" aria-label="Menu">${ic('menu',24)}</button><img src="icons/icon-192.png" alt=""><b>TELAROLLI</b></div>
  <div id="app">
    <aside class="side" id="side">
      <div class="brand"><img src="icons/icon-192.png" alt=""><div><b>TELAROLLI</b><span>Gestão da clínica</span></div></div>
      <nav class="nav" id="nav"></nav>
      <div class="me"><b>${h(S.me.nome)}</b>${PAPEIS[S.me.papel]}<br>
        <button class="btn sm ghost" style="color:#ccc;padding-left:0" id="logout">${ic('logout',14)} Sair</button></div>
    </aside>
    <main class="main" id="main"></main>
  </div>`;
  $('#mb').onclick = () => toggleSide(true);
  $('#logout').onclick = () => DEMO ? toast('No modo demo não há login') : sb.auth.signOut();
  window.onhashchange = route;
  route();
}
function toggleSide(open){ $('#side').classList.toggle('open', open); $('.scrim')?.remove(); if(open){ const s=document.createElement('div'); s.className='scrim'; s.onclick=()=>toggleSide(false); document.body.appendChild(s);} }
const parts = () => (location.hash.replace(/^#\/?/,'') || 'inicio').split('/');
function route(){
  toggleSide(false); closeAllModals();
  const ps = parts(); const r = ps[0]; const navK = NAVMAP[r] || r;
  $('#nav').innerHTML = NAV.filter(n=>n[3]()).map(([k,l,i])=>`<a href="#/${k}" class="${navK===k?'on':''}">${ic(i)}${l}</a>`).join('');
  const navItem = NAV.find(n=>n[0]===navK);
  if(navItem && !navItem[3]()) return location.hash = '#/inicio';
  if(['avaliacao','treino'].includes(r) && !can.clinico()) return location.hash = '#/inicio';
  (VIEWS()[r] || vInicio)(...ps.slice(1));
  window.scrollTo(0,0);
}
const rerender = () => { const y = window.scrollY; const ps = parts(); (VIEWS()[ps[0]]||vInicio)(...ps.slice(1)); window.scrollTo(0,y); };
const page = (eyebrow, title, actions='', body='') => { $('#main').innerHTML = `<div class="top"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1></div><div class="btns">${actions}</div></div>${body}`; };
const statusPill = st => `<span class="pill ${st==='realizada'?'ok':st==='falta'?'bad':st==='justificada'?'warn':st==='cancelada'?'':'info'}">${STATUS_SESSAO[st]||st}</span>`;

/* ============================ INÍCIO ============================ */
function vInicio(){
  const t = today(), ws = startOfWeek(t), we = addDays(ws,6), m0 = t.slice(0,7);
  const ss = sessoes();
  const hoje = sortBy(ss.filter(s=>s.data===t && s.status!=='cancelada'), s=>s.hora||'');
  const semana = ss.filter(s=>s.data>=ws && s.data<=we && s.status!=='cancelada');
  const pacs = pacientes(); const ativos = pacs.filter(p=>(p.status||'ativo')==='ativo');
  const mesS = ss.filter(s=>s.data.startsWith(m0) && s.data<=t && !['agendada','cancelada'].includes(s.status));
  const pres = mesS.filter(s=>s.status==='realizada').length;
  let kpis = `
    <div class="card kpi"><div class="l">Pacientes ativos</div><div class="v">${ativos.length}</div><div class="s">${pacs.length} cadastrados</div></div>
    <div class="card kpi"><div class="l">Sessões nesta semana</div><div class="v">${semana.length}</div><div class="s">${semana.filter(s=>s.status==='realizada').length} com presença</div></div>
    <div class="card kpi"><div class="l">Presença no mês</div><div class="v">${mesS.length?Math.round(pres/mesS.length*100)+'%':'—'}</div><div class="s">${mesS.filter(s=>s.status==='falta').length} faltas · ${mesS.filter(s=>s.status==='justificada').length} justificadas</div></div>`;
  let alertas = [];
  if(can.financeiro()){
    const parc = pacotes().flatMap(p=>(p.parcelas||[]).map((x,i)=>({...x, i, pac:p})));
    const recebidoMes = parc.filter(x=>x.pago && (x.dataPag||x.venc).startsWith(m0)).reduce((a,x)=>a+Number(x.valor||0),0);
    const aReceber = parc.filter(x=>!x.pago && x.venc.startsWith(m0)).reduce((a,x)=>a+Number(x.valor||0),0);
    kpis += `<div class="card kpi"><div class="l">Recebido no mês</div><div class="v" style="font-size:30px">${brl(recebidoMes)}</div><div class="s">${brl(aReceber)} ainda a receber</div></div>`;
    parc.filter(x=>parcelaStatus(x)==='atrasada').forEach(x=>alertas.push({tipo:'bad', txt:`Parcela ${x.n} de <b>${h(paciente(x.pac.pacienteId)?.nome||'?')}</b> vencida em ${fmtD(x.venc)} — ${brl(x.valor)}${x.lembretes?.length?` · lembrete enviado ${fmtDs(x.lembretes[x.lembretes.length-1])}`:''}`, href:'#/paciente/'+x.pac.pacienteId+'/financeiro'}));
  }
  ativos.forEach(p=>{
    const sd = saldoPaciente(p.id);
    if(sd.temPacote && sd.restantes<=3) alertas.push({tipo:'warn', txt:`<b>${h(p.nome)}</b>: ${sd.restantes<=0?'pacote esgotado':`restam ${sd.restantes} sessões no pacote`} — conversar sobre renovação/reavaliação`, href:'#/paciente/'+p.id+'/financeiro'});
    if(!sd.temPacote && can.financeiro()) alertas.push({tipo:'info', txt:`<b>${h(p.nome)}</b> está ativo sem pacote cadastrado`, href:'#/paciente/'+p.id+'/financeiro'});
    const ult = sortBy(ss.filter(s=>s.pacienteId===p.id && s.status==='realizada'), s=>s.data, true)[0];
    const prox = ss.find(s=>s.pacienteId===p.id && s.status==='agendada' && s.data>=t);
    if(!prox && ult && diffDays(ult.data,t)>=10) alertas.push({tipo:'warn', txt:`<b>${h(p.nome)}</b> sem sessão há ${diffDays(ult.data,t)} dias e sem horário futuro`, href:'#/paciente/'+p.id});
    const fq = frequencia(p.id, addDays(t,-30)); if(fq.total>=4 && fq.pct<75) alertas.push({tipo:'warn', txt:`<b>${h(p.nome)}</b> com presença de ${fq.pct}% nos últimos 30 dias`, href:'#/paciente/'+p.id+'/sessoes'});
  });
  const pend = hoje.filter(s=>s.status==='agendada' && (s.hora||'00:00') < new Date().toTimeString().slice(0,5)).length;
  const hr = new Date().getHours(); const saud = hr<12?'Bom dia':hr<18?'Boa tarde':'Boa noite';
  page(`${DOW[new Date().getDay()]}, ${fmtD(t)}`, `${saud}, ${h(S.me.nome.split(' ')[0])}`,
    `<a class="btn" href="#/presenca">${ic('check')} Presença</a><button class="btn pri" id="np">${ic('plus')} Novo paciente</button>`,
    `<div class="grid g4">${kpis}</div>
     <div class="grid g2" style="margin-top:14px">
      <div class="card"><div class="card-h"><h3>Agenda de hoje</h3><div class="btns">${pend?`<span class="pill warn">${pend} sem presença marcada</span>`:''}<span class="pill">${hoje.length} sessões</span></div></div>
        ${hoje.length? hoje.map(s=>{ const p = paciente(s.pacienteId); return `<div class="list-row" data-s="${s.id}" style="cursor:pointer"><div class="nowrap" style="font-family:var(--cond);font-size:20px;font-weight:600;width:56px">${h(s.hora||'--:--')}</div><div class="grow"><b>${h(p?.nome||'Paciente removido')}</b><div class="tiny">${h(p?.diagnostico||'')} · ${h(nomeFisio(s.fisioId))}</div></div>${statusPill(s.status)}</div>`; }).join('') : '<div class="empty">Nenhuma sessão hoje</div>'}
      </div>
      <div class="card"><div class="card-h"><h3>Atenção</h3><span class="pill">${alertas.length}</span></div>
        ${alertas.length ? alertas.slice(0,14).map(a=>`<a class="list-row" href="${a.href}" style="text-decoration:none"><span class="pill ${a.tipo}" style="min-width:10px;padding:2px 5px">●</span><div class="grow small">${a.txt}</div></a>`).join('') : '<div class="empty">Tudo em dia ✓</div>'}
      </div>
     </div>`);
  $('#np').onclick = () => editPaciente();
  $$('[data-s]').forEach(el=>el.onclick=()=>editSessao(sessoes().find(s=>s.id===el.dataset.s)));
}

/* ============================ PACIENTES ============================ */
function vPacientes(){
  const f = S.ui.pf ||= { q:'', st:'ativo', fin:'' };
  const t = today(); const fin = can.financeiro();
  let list = pacientes();
  if(f.st!=='todos') list = list.filter(p=>(p.status||'ativo')===f.st);
  if(f.q){ const q = f.q.toLowerCase(); list = list.filter(p=>(p.nome+' '+(p.diagnostico||'')+' '+(p.telefone||'')).toLowerCase().includes(q)); }
  const finOf = {}; if(fin) list.forEach(p=>finOf[p.id]=finPaciente(p.id));
  if(fin && f.fin==='atraso') list = list.filter(p=>finOf[p.id].atrasado>0);
  if(fin && f.fin==='sem') list = list.filter(p=>!finOf[p.id].pacotes.length);
  list = sortBy(list, p=>p.nome.toLowerCase());
  const ss = sessoes();
  page('Cadastro e acompanhamento', 'Pacientes', `<button class="btn pri" id="np">${ic('plus')} Novo paciente</button>`,
   `<div class="card">
     <div class="card-h"><input type="search" id="q" placeholder="Buscar por nome, diagnóstico ou telefone" value="${h(f.q)}" style="max-width:340px">
       <div class="btns"><div class="seg">${[['ativo','Ativos'],['pausado','Pausados'],['alta','Alta'],['todos','Todos']].map(([k,l])=>`<button data-st="${k}" class="${f.st===k?'on':''}">${l}</button>`).join('')}</div>
       ${fin?`<div class="seg">${[['','Financeiro: todos'],['atraso','Em atraso'],['sem','Sem pacote']].map(([k,l])=>`<button data-fin="${k}" class="${f.fin===k?'on':''}">${l}</button>`).join('')}</div>`:''}</div></div>
     <div class="tablewrap"><table><thead><tr><th>Paciente</th><th class="hide-m">Diagnóstico / protocolo</th><th class="hide-m">Fisio</th><th>Última</th><th>Próxima</th><th class="num">Sessões</th>${fin?'<th>Financeiro</th><th></th>':''}</tr></thead><tbody>
     ${list.map(p=>{
       const ps = ss.filter(s=>s.pacienteId===p.id);
       const ult = sortBy(ps.filter(s=>s.status==='realizada'), s=>s.data, true)[0];
       const prox = sortBy(ps.filter(s=>s.status==='agendada' && s.data>=t), s=>s.data+s.hora)[0];
       const pr = protocolo(p.protocoloId); const sd = saldoPaciente(p.id); const fp = finOf[p.id];
       const atrasadas = fp ? fp.parcelas.filter(x=>x.st==='atrasada') : [];
       return `<tr class="click" data-id="${p.id}"><td><div style="display:flex;gap:10px;align-items:center"><div class="avatar">${initials(p.nome)}</div><div><b>${h(p.nome)}</b><div class="tiny">${idade(p.nascimento)!=null?idade(p.nascimento)+' anos · ':''}${h(p.telefone||'')}</div></div></div></td>
         <td class="hide-m">${h(p.diagnostico||'—')}${pr?`<div class="tiny">${h(pr.nome)} · ${h(pr.fases[p.fase||0]?.nome||'')}</div>`:''}</td>
         <td class="hide-m">${h(nomeFisio(p.fisioId))}</td><td class="nowrap">${ult?fmtDs(ult.data):'—'}</td><td class="nowrap">${prox?fmtDs(prox.data)+' '+h(prox.hora||''):'<span class="tiny">sem horário</span>'}</td>
         <td class="num">${sd.temPacote?`<span class="pill ${sd.restantes<=0?'bad':sd.restantes<=3?'warn':''}">${sd.usadas}/${sd.total}</span>`:'<span class="tiny">—</span>'}</td>
         ${fin?`<td>${!fp.pacotes.length?'<span class="pill">Sem pacote</span>':fp.atrasado>0?`<span class="pill bad">Atraso ${brl(fp.atrasado)}</span>`:fp.aberto>0?`<span class="pill info">Em dia · ${brl(fp.aberto)} a vencer</span>`:'<span class="pill ok">Quitado</span>'}${fp.naoPagas>0?`<div class="tiny">${fp.naoPagas} sessão(ões) realizada(s) sem pagamento</div>`:''}</td>
         <td>${atrasadas.length?`<button class="btn sm" data-wa="${atrasadas[0].pk.id}:${atrasadas[0].i}" title="Cobrar via WhatsApp">${ic('wpp',14)} Cobrar</button>`:''}</td>`:''}</tr>`;
     }).join('') || `<tr><td colspan="9"><div class="empty">Nenhum paciente encontrado</div></td></tr>`}
     </tbody></table></div></div>`);
  $('#np').onclick = () => editPaciente();
  const q = $('#q'); q.oninput = () => { f.q = q.value; clearTimeout(S.ui.qt); S.ui.qt = setTimeout(()=>{ vPacientes(); const n=$('#q'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); }, 250); };
  $$('[data-st]').forEach(b=>b.onclick=()=>{ f.st=b.dataset.st; vPacientes(); });
  $$('[data-fin]').forEach(b=>b.onclick=()=>{ f.fin=b.dataset.fin; vPacientes(); });
  $$('[data-wa]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const [id,i] = b.dataset.wa.split(':'); enviarLembrete(id, +i); });
  $$('tr[data-id]').forEach(tr=>tr.onclick=()=>location.hash='#/paciente/'+tr.dataset.id);
}
function editPaciente(p){
  const novo = !p; p = p || { status:'ativo', fisioId: S.me.papel!=='recepcao'?S.me.id:'', fase:0, criadoEm:today() };
  const prots = [['','— sem protocolo —'], ...protocolos().map(x=>[x.id,x.nome])];
  modal(novo?'Novo paciente':'Editar cadastro', `<div class="form">
    ${sec('Identificação')}
    ${fld('Nome completo','nome',p.nome,{cls:'c8',req:true})}
    ${fld('Nascimento','nascimento',p.nascimento,{type:'date',cls:'c4'})}
    ${fld('Sexo','sexo',p.sexo,{cls:'c3 keep',opts:[['',''],['F','Feminino'],['M','Masculino'],['O','Outro']]})}
    ${fld('Telefone / WhatsApp','telefone',p.telefone,{type:'tel',cls:'c4'})}
    ${fld('E-mail','email',p.email,{type:'email',cls:'c4'})}
    ${fld('Profissão','profissao',p.profissao,{cls:'c4'})}
    ${fld('Esporte / atividade','esporte',p.esporte,{cls:'c4'})}
    ${fld('Membro dominante','dominante',p.dominante,{cls:'c4',opts:['','Direito','Esquerdo']})}
    ${fld('Endereço','endereco',p.endereco,{cls:'c8'})}
    ${fld('Como conheceu a clínica','origem',p.origem,{cls:'c4',opts:['','Indicação médica','Indicação de paciente','Instagram','Google','Clube / equipe','Outro']})}
    ${sec('Diagnóstico e acompanhamento')}
    ${fld('Diagnóstico / hipótese diagnóstica','diagnostico',p.diagnostico,{cls:'c8'})}
    ${fld('Membro lesado','membroLesado',p.membroLesado,{cls:'c4',opts:['','Direito','Esquerdo','Bilateral','N/A']})}
    ${fld('Médico responsável','medico',p.medico,{cls:'c6'})}
    ${fld('Data da lesão','dataLesao',p.dataLesao,{type:'date',cls:'c3 keep'})}
    ${fld('Data da cirurgia','dataCirurgia',p.dataCirurgia,{type:'date',cls:'c3 keep'})}
    ${fld('Protocolo','protocoloId',p.protocoloId,{cls:'c6',opts:prots})}
    ${fld('Fisioterapeuta responsável','fisioId',p.fisioId,{cls:'c6',opts:[['',''],...fisios().map(m=>[m.id,m.nome])]})}
    ${novo?'':fld('Status','status',p.status,{cls:'c4',opts:[['ativo','Ativo'],['pausado','Pausado'],['alta','Alta']]})}
    ${fld('Observações (administrativas)','obs',p.obs,{type:'textarea',cls:'',rows:2})}
  </div>`, { onSave: async d => {
      if(!d.nome) { toast('Informe o nome', true); return false; }
      const id = p.id || uid();
      const data = {...p, ...d}; delete data.id;
      if(novo) data.fase = 0;
      if(data.status==='alta' && p.status!=='alta') data.altaEm = today();
      if(d.protocoloId!==p.protocoloId) { data.fase = 0; data.faseHist = [...(p.faseHist||[]), {fase:0, protocoloId:d.protocoloId, data:today()}]; }
      await save('pacientes/'+id, data, novo?'Paciente cadastrado':'Cadastro atualizado');
      if(novo) location.hash = '#/paciente/'+id; else rerender();
    }, wide:true,
    danger: !novo && can.admin() ? { label:'Excluir paciente', confirm:'Excluir este paciente e todo o histórico clínico? Sessões e pacotes ficam no histórico financeiro.', fn: async ()=>{ await remove('pacientes/'+p.id); await remove('clinico/'+p.id,'Paciente excluído'); location.hash='#/pacientes'; } } : null });
}

const PTABS = [['resumo','Resumo'],['avaliacoes','Avaliações'],['protocolo','Protocolo'],['atendimentos','Atendimentos & dor'],['treinos','Treinos & casa'],['sessoes','Presença'],['financeiro','Financeiro'],['documentos','Documentos']];
const PTAB_CLIN = ['avaliacoes','protocolo','atendimentos','treinos'];
function vPaciente(id, tab='resumo'){
  const p = paciente(id); if(!p) return page('Pacientes','Paciente não encontrado','<a class="btn" href="#/pacientes">Voltar</a>');
  const tabs = PTABS.filter(([k])=> (can.clinico() || !PTAB_CLIN.includes(k)) && (k!=='financeiro' || can.financeiro()));
  if(!tabs.find(t=>t[0]===tab)) tab = 'resumo';
  const pr = protocolo(p.protocoloId);
  const ag = [idade(p.nascimento)!=null?idade(p.nascimento)+' anos':'', p.esporte, p.membroLesado?'Membro lesado: '+p.membroLesado:'', p.dataCirurgia?`Cirurgia: ${fmtD(p.dataCirurgia)} (${Math.floor(diffDays(p.dataCirurgia,today())/7)} sem)`:'', 'Fisio: '+nomeFisio(p.fisioId)].filter(Boolean);
  $('#main').innerHTML = `
    <div class="top"><div class="phead"><div class="avatar">${initials(p.nome)}</div><div>
      <div class="eyebrow"><a href="#/pacientes" style="text-decoration:none">← Pacientes</a></div>
      <h1>${h(p.nome)}</h1>
      <div class="meta"><span class="pill ${p.status==='alta'?'dark':p.status==='pausado'?'warn':'ok'}">${p.status==='alta'?'Alta':p.status==='pausado'?'Pausado':'Ativo'}</span>${p.diagnostico?`<b style="color:var(--ink)">${h(p.diagnostico)}</b>`:''}${pr?`<span>${h(pr.nome)} · ${h(pr.fases[p.fase||0]?.nome||'')}</span>`:''}${ag.map(x=>`<span>${h(x)}</span>`).join('')}</div>
    </div></div></div>
    <div class="btns" style="margin:-4px 0 14px">
      ${can.clinico()?`<button class="btn pri" id="avc">${ic('steth')} Avaliação clínica</button><button class="btn pri" id="avf">${ic('bolt')} Avaliação funcional</button><button class="btn" id="atd">${ic('clip')} Registrar atendimento</button>`:''}
      <button class="btn" id="nss">${ic('cal')} Agendar</button><button class="btn" id="edp">${ic('edit')} Cadastro</button>
      ${p.telefone?`<button class="btn ghost" id="wap">${ic('wpp')} WhatsApp</button>`:''}</div>
    <div class="tabs">${tabs.map(([k,l])=>`<a href="#/paciente/${id}/${k}" class="${k===tab?'on':''}">${l}</a>`).join('')}</div>
    <div id="ptab"></div>`;
  $('#edp').onclick = () => editPaciente(p);
  $('#nss').onclick = () => editSessao(null, { pacienteId:id, fisioId:p.fisioId });
  $('#wap') && ($('#wap').onclick = () => waAbrir(p.telefone, `Olá, ${p.nome.split(' ')[0]}! `));
  if(can.clinico()){ $('#avc').onclick = () => novaAvaliacao(p, 'clinica'); $('#avf').onclick = () => novaAvaliacao(p, 'funcional'); $('#atd').onclick = () => editAtendimento(p); }
  ({ resumo:tResumo, avaliacoes:tAvaliacoes, protocolo:tProtocolo, atendimentos:tAtendimentos, treinos:tTreinos, sessoes:tSessoes, financeiro:tFinanceiro, documentos:tDocumentos })[tab](p);
}
const saveClin = (id, c, msg) => save('clinico/'+id, c, msg);

function tResumo(p){
  const c = clin(p.id); const t = today();
  const ss = sessoes().filter(s=>s.pacienteId===p.id);
  const fq = frequencia(p.id);
  const prox = sortBy(ss.filter(s=>s.status==='agendada'&&s.data>=t), s=>s.data+s.hora).slice(0,4);
  const ultDor = sortBy(c.dor, d=>d.data, true)[0], priDor = sortBy(c.dor, d=>d.data)[0];
  const sd = saldoPaciente(p.id);
  const ad = c.adesao.filter(a=>a.data>=addDays(t,-28)); const adPct = ad.length ? Math.round(ad.reduce((a,x)=>a+(x.status==='fez'?1:x.status==='parcial'?.5:0),0)/ad.length*100) : null;
  const ultEv = sortBy(c.evolucoes, e=>e.data, true).slice(0,3);
  const ultAv = sortBy(c.avaliacoes, a=>a.data, true)[0];
  $('#ptab').innerHTML = `
   <div class="grid g4">
     <div class="card kpi"><div class="l">Presença</div><div class="v">${fq.pct!=null?fq.pct+'%':'—'}</div><div class="s">${fq.pres} presenças · ${fq.falt} faltas · ${fq.just} justif.</div></div>
     <div class="card kpi"><div class="l">Pacote</div><div class="v">${sd.temPacote?sd.restantes:'—'}</div><div class="s">${sd.temPacote?`sessões restantes de ${sd.total}`:'sem pacote ativo'}</div></div>

function tProtocolo(p){

  const fi = p.fase||0, f = pr.fases[fi] || pr.fases[0]; const ts = treinosDaFase(pr.id, fi);
  const hist = (p.faseHist||[]).filter(x=>x.protocoloId===undefined || x.protocoloId===p.protocoloId);
  $('#ptab').innerHTML = `
   <div class="card"><div class="card-h"><div><h2>${h(pr.nome)}</h2><div class="tiny">${pr.sessoes} sessões · ${h(pr.frequencia)} · ${h(pr.duracao)}</div></div><div class="btns"><a class="btn sm" href="#/protocolos/${pr.id}">Abrir protocolo</a><button class="btn sm" id="trocar">Trocar protocolo</button></div></div>
     <div class="phases">${pr.fases.map((x,i)=>`<div class="phase ${i===fi?'on':i<fi?'done':''}" data-f="${i}"><b>${h(x.nome)}</b><div class="tiny" style="color:inherit;opacity:.75">${i<fi?'concluída':i===fi?'atual':''}${hist.find(hh=>hh.fase===i)?' · desde '+fmtDs(hist.filter(hh=>hh.fase===i).pop().data):''}</div></div>`).join('')}</div>
   </div>
   <div class="grid g2" style="margin-top:14px">

      ${fi<pr.fases.length-1?`<button class="btn pri" id="avanca">Avançar para ${h(pr.fases[fi+1].nome)} →</button>`:''}</div>
    <div class="card"><div class="card-h"><h3>Treinos desta fase</h3><button class="btn sm" id="ntf">${ic('plus',14)} Novo treino</button></div>
      ${ts.length?ts.map(t=>treinoCard(t, `<button class="btn sm pri" data-usar="${t.id}">Registrar atendimento</button>`)).join(''):'<div class="empty small">Nenhum treino nesta fase</div>'}</div>
   </div>
   <div class="card" style="margin-top:14px"><h3>Critérios de alta</h3><p class="small">${h(pr.criteriosAlta)}</p><div class="tiny">Escalas sugeridas: ${(pr.proms||[]).map(k=>PROMS[k]?.nome).filter(Boolean).join(', ')||'—'}${pr.rts?` · Protocolo de RTS: ${h(RTS[pr.rts]?.nome||'')}`:''}</div></div>`;
  $('#trocar').onclick = () => editPaciente(p);
  const setFase = async i => { const d = {...p, fase:i, faseHist:[...(p.faseHist||[]), {fase:i, protocoloId:p.protocoloId, data:today()}]}; await save('pacientes/'+p.id, d, `Fase atual: ${pr.fases[i].nome}`); rerender(); };
  $$('[data-f]').forEach(el=>el.onclick=()=>{ const i=+el.dataset.f; if(i!==fi && confirm(`Mudar a fase atual para ${pr.fases[i].nome}?`)) setFase(i); });
  $('#avanca') && ($('#avanca').onclick = () => setFase(fi+1));

function bindEva(root){

function editDor(p, d){

    <div class="f"><label>Nível de dor agora</label>${evaPicker('atual', d.atual)}</div>
    <div class="f c6"><label>Menor dor do dia</label>${evaPicker('menor', d.menor)}</div>
    <div class="f c6"><label>Maior dor do dia</label>${evaPicker('maior', d.maior)}</div>
    <div class="f"><label>Local</label>${chipsMulti('regioes', REGIOES_DOR, d.regioes||[])}</div>
    ${fld('Tipo de dor','tipo',d.tipo,{cls:'c6',opts:['',...TIPOS_DOR]})}
    ${fld('Observação','obs',d.obs,{cls:'c6'})}
  </div>`, { onOpen: f=>bindEva(f), onSave: async v => {
      if(v.atual===''){ toast('Marque o nível de dor atual', true); return false; }
      const reg = {...d, ...v, atual:+v.atual, menor:num(v.menor), maior:num(v.maior), id:d.id||uid()};
      c.dor = novo ? [...c.dor, reg] : c.dor.map(x=>x.id===d.id?reg:x);
      await saveClin(p.id, c, 'Dor registrada'); rerender();

function aplicarProm(p, key, reg){
  const P = PROMS[key]; const c = clin(p.id); const resp = reg?.resp || [];
  const body = `<p class="small muted" style="margin-top:0">${h(P.desc)}</p>${P.intro?`<p><b>${h(P.intro)}</b></p>`:''}
   ${fld('Data de aplicação','data',reg?.data||today(),{type:'date',cls:''}).replace('class="f "','class="f" style="max-width:200px;margin-bottom:8px"')}
   ${P.itens.map((it,i)=>`<div class="q"><div class="qt">${i+1}. ${h(it.t)}</div>
     ${P.tipo==='escala10' ? `<div class="scale10">${[...Array(11)].map((_,v)=>`<label><input type="radio" name="q${i}" value="${v}" ${resp[i]===v?'checked':''}><span>${v}</span></label>`).join('')}</div><div class="tiny" style="display:flex;justify-content:space-between;max-width:420px;margin-top:3px"><span>0 = ${h(it.a[0])}</span><span>10 = ${h(it.a[1])}</span></div>`
     : `<div class="opts">${it.o.map(([l,pt],k)=>`<label><input type="radio" name="q${i}" value="${k}" ${resp[i]===k?'checked':''}><span>${h(l)}</span></label>`).join('')}</div>`}
   </div>`).join('')}
   <div class="scorebar" id="sb">Pontuação: —</div>`;
  const calc = form => { const v = formData(form); const r = P.itens.map((_,i)=> v['q'+i]==null ? null : +v['q'+i]); const raw = P.tipo==='escala10' ? r : r.map((x,i)=> x==null?null : x); const s = P.score(raw, P); return { r:raw, s }; };
  modal(P.nome, body, { wide:true, saveLabel:'Salvar resultado',
    onOpen: form => { const upd = () => { const {r,s} = calc(form); const n = r.filter(x=>x!=null).length; $('#sb').innerHTML = s==null ? `Pontuação: — <span class="tiny">(${n}/${P.itens.length} respondidas)</span>` : `Pontuação: ${r1(s)}${P.pct?'%':''} / ${P.max}${P.pct?'%':''} ${P.classif?`<span class="pill">${P.classif(s)}</span>`:''}`; }; form.addEventListener('change', upd); upd(); },
    onSave: async (v, form) => { const {r,s} = calc(form); if(s==null){ toast(P.opcional?'Responda ao menos 8 itens':'Responda todos os itens', true); return false; }
      const rec = { id:reg?.id||uid(), data:v.data, escala:key, resp:r, score:s, avId: reg?.avId || window._promAv || undefined };
      c.proms = reg ? c.proms.map(x=>x.id===reg.id?rec:x) : [...c.proms, rec];
      await saveClin(p.id, c, `${P.nome}: ${r1(s)}`); (window._promCb||rerender)(); window._promCb=null; },
    danger: reg?{ fn: async()=>{ c.proms = c.proms.filter(x=>x.id!==reg.id); await saveClin(p.id,c,'Resultado excluído'); rerender(); } }:null });
}

       $('#exl',bg).innerHTML = `<div class="tiny" style="margin-bottom:6px">${l.length} exercícios${l.length>60?' — mostrando 60, refine a busca':''}</div>` + (l.slice(0,60).map(e=>`<div class="list-row click" data-x2="${h(e.id)}" style="cursor:pointer"><div class="grow"><b>${h(e.nome)}</b><div class="tiny">${h(e.categoria)} · ${h(e.regiao)}${e.equipamento?' · '+h(e.equipamento):''}${e.nivel&&e.nivel.length<30?' · '+h(e.nivel):''}</div></div>${e.video?`<a href="${h(e.video)}" target="_blank" rel="noopener" class="btn sm ghost" onclick="event.stopPropagation()">${ic('video',14)}</a>`:''}<button class="btn sm" type="button">Adicionar</button></div>`).join('') || '<div class="empty">Nada encontrado</div>');

/* ---------- Atendimento (sessão do dia) ---------- */
function editAtendimento(p, ev, preset={}){
  const c = clin(p.id); const novo = !ev;
  const st = ev ? JSON.parse(JSON.stringify(ev)) : { id:uid(), data:preset.data||today(), fisioId:S.me.id, sessaoId:preset.sessaoId||'', treinoId:'', treinoNome:'', exercicios:[], condutas:[], educacao:[], educacaoObs:'', texto:'', eva:'' };
  const aplicarTreino = id => { const t = treino(id); st.treinoId = id||''; st.treinoNome = t?.nome||''; if(t){ st.exercicios = JSON.parse(JSON.stringify(t.exercicios)); st.condutas = JSON.parse(JSON.stringify(t.condutas)); st.educacao = [...(t.educacao||[])]; st.educacaoObs = t.educacaoObs||''; } };
  if(novo){
    const pr = protocolo(p.protocoloId); const sug = pr ? treinosDaFase(pr.id, p.fase||0) : [];
    const ult = sortBy(c.evolucoes.filter(e=>e.treinoId), e=>e.data, true)[0];
    aplicarTreino(preset.treinoId || ult?.treinoId || sug[0]?.id || '');
  }
  const pr = protocolo(p.protocoloId); const daFase = pr ? treinosDaFase(pr.id, p.fase||0) : [];
  const outros = treinos().filter(t=>!daFase.includes(t));
  const opt = t => `<option value="${t.id}" ${st.treinoId===t.id?'selected':''}>${h(t.nome)}</option>`;

function regioesSugeridas(p){
  const d = (p.diagnostico||'')+' '+(protocolo(p.protocoloId)?.regiao||'');
  const r = REGIOES_AV.filter(x=> new RegExp(x.split('/')[0].replace('Coluna ',''),'i').test(d));
  if(/lca|patel|menisc|joelho/i.test(d) && !r.includes('Joelho')) r.push('Joelho');
  if(/lomb/i.test(d) && !r.includes('Coluna lombar')) r.push('Coluna lombar');
  if(/tornoz|entorse|aquil/i.test(d) && !r.includes('Tornozelo/Pé')) r.push('Tornozelo/Pé');
  return r;
}
async function novaAvaliacao(p, tipo){
  const c = clin(p.id);

  const prev = sortBy(c.avaliacoes, a=>a.data, true)[0];
  const av = { id:uid(), tipo, data:today(), status:'rascunho', fisioId:S.me.id, regioes: prev?.regioes?.length ? prev.regioes : regioesSugeridas(p), dados:{} };
  // reaproveita a anamnese da avaliação anterior como ponto de partida
  if(prev?.dados?.anamnese) av.dados.anamnese = JSON.parse(JSON.stringify(prev.dados.anamnese));
  c.avaliacoes = [...c.avaliacoes, av];
  await saveClin(p.id, c);

  location.hash = `#/avaliacao/${p.id}/${av.id}`;
}

// todas as linhas bilaterais com LSI calculável
function lsiLinhas(av, p){
  const out = [];
  for(const s of secoesDe(av.tipo)) for(const c of s.campos){ if(c.t!=='bil' || !c.def) continue;
    const v = av.dados?.[s.k]?.[c.k] || {};
    for(const key of Object.keys(v)){ if(key==='_g' || /Comprimento/.test(key)) continue; const l = lsiVal(v[key], p, (c.menor||[]).includes(key)); if(l!=null) out.push({sec:s.t, item:key.split('|').pop(), key:s.k+'.'+c.k+'.'+key, lsi:l}); } }
  return out;
}
function avDestaques(av, p, compact){
  const d = av.dados||{}; const bits = [];
  if(d.palpacao?.evaAtual!=null && d.palpacao.evaAtual!=='') bits.push(`<span class="pill" style="color:${evaColor(+d.palpacao.evaAtual)}">EVA ${d.palpacao.evaAtual}</span>`);
  const l = sortBy(lsiLinhas(av,p), x=>x.lsi).slice(0, compact?4:8);
  l.forEach(x=>bits.push(`<span class="pill ${x.lsi>=90?'ok':x.lsi>=80?'warn':'bad'}">${h(x.item.replace(/\s*\(.*\)/,''))} ${Math.round(x.lsi)}%</span>`));
  if(d.conclusao?.liberacao) bits.push(`<span class="pill dark">${h(d.conclusao.liberacao)}</span>`);
  const rts = rtsDados(av)?.protocolo ? rtsResumo(av,p) : null; if(rts) bits.push(`<span class="pill ${rts.ok===rts.total?'ok':'warn'}">RTS ${rts.ok}/${rts.total}</span>`);
  const txt = compact ? '' : (d.conclusao?.diagnostico ? `<p class="small" style="margin:8px 0 0">${h(d.conclusao.diagnostico)}</p>` : '');
  return (bits.length?`<div class="chips" style="margin-top:6px">${bits.join('')}</div>`:'') + txt;
}
function compLSI(p, avs){
  const asc = [...avs].reverse(); const rows = new Map();
  asc.forEach(a=>lsiLinhas(a,p).forEach(x=>{ if(!rows.has(x.key)) rows.set(x.key, {item:x.item, sec:x.sec, v:{}}); rows.get(x.key).v[a.id]=x.lsi; }));
  if(!rows.size) return '<div class="empty small">Sem medidas bilaterais para comparar</div>';
  return `<div class="tablewrap"><table><thead><tr><th>Teste</th>${asc.map(a=>`<th class="num">${fmtDs(a.data)}</th>`).join('')}</tr></thead><tbody>${[...rows.values()].map(r=>`<tr><td>${h(r.item)} <span class="tiny">${h(r.sec)}</span></td>${asc.map(a=>`<td class="num">${r.v[a.id]!=null?lsiPill(r.v[a.id]):'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="tiny" style="margin-top:4px">LSI = membro lesado ÷ membro não lesado (tempo: invertido). Sem membro lesado definido = menor ÷ maior.</div>`;
}
const rtsDados = av => av?.dados?.rts?.rts;
function rtsResumo(av, p){
  const r = rtsDados(av); const P = RTS[r?.protocolo]; if(!P) return null;
  let ok=0, total=0;
  P.crit.forEach((c,i)=>{ const man = r.crit?.[i]; const auto = c.ok ? c.ok(av,p) : null; const st = man || (auto===true?'ok':auto===false?'nao':''); if(st==='na') return; total++; if(st==='ok') ok++; });
  return { ok, total, nome:P.nome };
}

/* ---------- assistente de avaliação ---------- */
function vAvaliacao(pid, avid, modo){
  const p = paciente(pid); const c = clin(pid); const av = c.avaliacoes.find(a=>a.id===avid);
  if(!p || !av){ location.hash = '#/paciente/'+pid+'/avaliacoes'; return; }
  if(modo==='ver') return vAvaliacaoVer(p, av);
  av.dados ||= {};
  const secs = secoesDe(av.tipo);
  let step = Math.min(S.ui.avStep||0, secs.length-1);

     <div class="card" style="padding:12px 16px;margin-bottom:14px"><div class="lbl" style="margin-bottom:6px">Regiões avaliadas</div><div class="chips">${REGIOES_AV.map(r=>`<span class="chip ${av.regioes?.includes(r)?'on':''}" data-reg="${h(r)}">${h(r)}</span>`).join('')}</div></div>
     <div class="wiz">
       <nav class="steps">${secs.map((x,i)=>`<button class="${i===step?'on':''} ${preenchida(x)?'done':''}" data-step="${i}"><span class="n">${preenchida(x)&&i!==step?'✓':i+1}</span>${h(x.t)}${x.funcional?'<span class="tiny" style="margin-left:auto;opacity:.7">func.</span>':''}</button>`).join('')}</nav>
       <section class="card" id="avSec" style="min-width:0">

    $$('[data-reg]').forEach(ch=>ch.onclick=()=>{ const r = ch.dataset.reg; av.regioes ||= []; const i = av.regioes.indexOf(r); if(i>=0) av.regioes.splice(i,1); else av.regioes.push(r); agendar(); draw(); });

  };
  S.ui.avRedraw = draw;

function gruposPadrao(cpo, av){
  const g = Object.keys(cpo.grupos); const r = av.regioes||[];
  if(cpo.grupos===FORCA_GR){ const out=[]; if(r.some(x=>['Joelho','Quadril','Tornozelo/Pé'].includes(x))) out.push('Membros inferiores'); if(r.some(x=>['Ombro','Cotovelo','Punho/Mão'].includes(x))) out.push('Membros superiores'); if(r.some(x=>x.startsWith('Coluna'))) out.push('Tronco'); return out.length?out:['Membros inferiores']; }
  const m = g.filter(x=>r.includes(x)); return m.length ? m : g.slice(0,1);
}

    case 'rts': {

          return `<tr><td>${h(c.l)}</td><td>${a?`<span class="pill ${ok===true?'ok':ok===false?'bad':''}">${h(a)}</span>`:'<span class="tiny">preencher manualmente</span>'}</td><td><div class="seg">${[['ok','Atende'],['nao','Não atende'],['na','N/A']].map(([k2,l2])=>`<button type="button" data-c="rts" data-crit="${i}" data-st="${k2}" class="${(man||(ok===true?'ok':ok===false?'nao':''))===k2?'on':''}">${l2}</button>`).join('')}</div></td></tr>`; }).join('')}
        </tbody></table></div><div class="tiny" style="margin-top:6px">${h(P.ref)} · Os resultados automáticos vêm das etapas de força, hop tests, estabilidade, exame físico e escalas desta avaliação.</div>
        ${(()=>{ const rs = rtsResumo({...av, dados:{...av.dados, rts:{rts:{...r, protocolo:key}}}}, p); return rs?`<div style="margin-top:10px"><span class="pill ${rs.ok===rs.total&&rs.total?'ok':'warn'}" style="font-size:13px;padding:5px 12px">${rs.ok} de ${rs.total} critérios atendidos</span></div>`:''; })()}</div>
        <div class="f"><label>Observações sobre o retorno</label><textarea data-c="rts" data-rtsobs="1" rows="2">${h(r.obs||'')}</textarea></div>`:''}`; }
  }
  return '';
}
function bindCampos(root, s, av, p, onChange){
  const D = () => (av.dados[s.k] ||= {});
  const refreshCalc = () => { s.campos.filter(c=>c.t==='calc').forEach(c=>{ const el = $(`[data-calc="${c.k}"]`, root); if(el) el.innerHTML = c.f(D(), av); }); };
  root.addEventListener('input', e => {
    const el = e.target; const k = el.dataset.c; if(!k) return; const cpo = s.campos.find(c=>c.k===k);
    if(el.dataset.row){ const o = (D()[k] ||= {}); const row = (o[el.dataset.row] ||= {}); row[el.dataset.col] = el.value;
      const cell = root.querySelector(`[data-lsi="${CSS.escape(el.dataset.row)}"]`); if(cell && !/Comprimento/.test(el.dataset.row)) cell.innerHTML = lsiPill(lsiVal(row, p, (cpo.menor||[]).includes(el.dataset.row))); }
    else if(el.dataset.rtsobs){ (D().rts ||= {}).obs = el.value; }
    else if(!el.dataset.rtsp) D()[k] = el.value;
    refreshCalc(); onChange();
  });
  root.addEventListener('change', e => { const el = e.target; if(el.tagName==='SELECT' && el.dataset.row){ el.dispatchEvent(new Event('input', {bubbles:true})); } if(el.dataset.rtsp){ (D().rts ||= {}).protocolo = el.value; D().rts.crit = {}; onChange(); S.ui.avRedraw(); } });
  root.addEventListener('click', e => {
    const el = e.target.closest('[data-c],[data-promav]'); if(!el) return;
    if(el.dataset.promav){ window._promAv = av.id; window._promCb = () => { window._promAv = null; S.ui.avRedraw(); }; aplicarProm(p, el.dataset.promav); return; }
    const k = el.dataset.c;
    if(el.dataset.multi!==undefined){ const arr = (D()[k] ||= []); const o = el.dataset.multi; const i = arr.indexOf(o); if(i>=0) arr.splice(i,1); else arr.push(o); el.classList.toggle('on'); }
    else if(el.dataset.single!==undefined){ const o = el.dataset.single; D()[k] = D()[k]===o ? '' : o; $$(`[data-c="${k}"][data-single]`, root).forEach(x=>x.classList.toggle('on', x.dataset.single===D()[k])); }
    else if(el.dataset.eva!==undefined){ const val = el.dataset.eva; D()[k] = D()[k]===val ? '' : val; $$(`[data-c="${k}"][data-eva]`, root).forEach(x=>{ const on = x.dataset.eva===D()[k]; x.classList.toggle('on', on); x.style.background = on ? evaColor(+x.dataset.eva) : ''; }); }
    else if(el.dataset.opt!==undefined){ const o = (D()[k] ||= {}); o[el.dataset.row] = o[el.dataset.row]===el.dataset.opt ? '' : el.dataset.opt; onChange(); S.ui.avRedraw(); return; }
    else if(el.dataset.grp!==undefined){ const cpo = s.campos.find(c=>c.k===k); const o = (D()[k] ||= {}); o._g ||= gruposPadrao(cpo, av); const g = el.dataset.grp; const i = o._g.indexOf(g); if(i>=0) o._g.splice(i,1); else o._g.push(g); onChange(); S.ui.avRedraw(); return; }
    else if(el.dataset.crit!==undefined){ const r = (D().rts ||= {}); r.protocolo ||= $('[data-rtsp]', root)?.value || ''; r.crit ||= {}; r.crit[el.dataset.crit] = el.dataset.st; onChange(); S.ui.avRedraw(); return; }
    else return;
    refreshCalc(); onChange();
  });
}

function valorTxt(cpo, v, av, p, secDados){
  if(v==null || v==='' || (Array.isArray(v)&&!v.length)) return null;
  switch(cpo.t){
    case 'chips': return h(v.join(', '));
    case 'escala': { const e = Object.entries(v).filter(([,x])=>x); if(!e.length) return null; return `<table><tbody>${e.map(([k,x])=>`<tr><td>${h(k)}</td><td>${h(x)}</td></tr>`).join('')}</tbody></table>`; }
    case 'bil': { const cols = cpo.cols || [['D','Direito'],['E','Esquerdo']]; const rows = Object.entries(v).filter(([k,r])=>k!=='_g' && r && cols.some(([ck])=>r[ck])); if(!rows.length) return null;
      return `<div class="tablewrap"><table><thead><tr><th></th>${cols.map(([,l])=>`<th class="num">${h(l)}</th>`).join('')}${cpo.def?'<th class="num">LSI / simetria</th>':''}</tr></thead><tbody>${rows.map(([k,r])=>`<tr><td>${h(k.replace('|',' — '))}</td>${cols.map(([ck])=>`<td class="num">${h(r[ck]||'—')}</td>`).join('')}${cpo.def?`<td class="num">${/Comprimento/.test(k)?'':(lsiPill(lsiVal(r,p,(cpo.menor||[]).includes(k)))||'—')}</td>`:''}</tr>`).join('')}</tbody></table></div>`; }
    case 'rts': { const P = RTS[v.protocolo]; if(!P) return null; const rs = rtsResumo(av,p);
      return `<b>${h(P.nome)}</b> — ${rs.ok} de ${rs.total} critérios atendidos<table><tbody>${P.crit.map((c,i)=>{ const a = c.a?c.a(av,p):null; const ok = c.ok?c.ok(av,p):null; const st = v.crit?.[i] || (ok===true?'ok':ok===false?'nao':''); return `<tr><td>${h(c.l)}</td><td>${a?h(a):''}</td><td>${st==='ok'?'<span class="pill ok">Atende</span>':st==='nao'?'<span class="pill bad">Não atende</span>':st==='na'?'<span class="pill">N/A</span>':'—'}</td></tr>`; }).join('')}</tbody></table>${v.obs?`<p>${h(v.obs)}</p>`:''}<div class="tiny">${h(P.ref)}</div>`; }
    case 'proms': return null;
    case 'calc': { const r = cpo.f(secDados||{}, av); return r && !/^(D —|—)/.test(r) ? h(r) : null; }
    default: return h(v);
  }
}
function avResumoHTML(av, p){
  const c = clin(p.id); let out = '';

      const t = valorTxt(cpo, cpo.t==='calc'?true:d[cpo.k], av, p, d); if(t==null) continue;

}

function editPacote(pk, pacienteId){

  pk = pk || { pacienteId, protocoloId:p0?.protocoloId||'', descricao: pr0 ? `${pr0.nome} — ${pr0.sessoes} sessões` : 'Pacote de sessões', sessoes: pr0?.sessoes||10, valorSessao: cl.valorSessao, desconto:0, forma:'Pix', dataInicio: today(), status:'ativo', parcelas:[] };
  const pacs = sortBy(pacientes(), p=>p.nome.toLowerCase());
  const body = `<div class="form">
    ${fld('Paciente','pacienteId',pk.pacienteId,{cls:'c6',opts:[['','Selecione…'],...pacs.map(x=>[x.id,x.nome])]})}

    ${fld('Nº de sessões','sessoes',pk.sessoes,{type:'number',cls:'c3 keep'})}
    ${fld('Valor por sessão','valorSessao',pk.valorSessao,{type:'number',step:'0.01',cls:'c3 keep'})}

    <div class="f c3 keep"><label>Total</label><input type="text" id="tot" readonly style="font-weight:700;background:#f6f6f4"></div>
    ${fld('Início do pacote','dataInicio',pk.dataInicio,{type:'date',cls:'c4'})}
    ${fld('Forma de pagamento','forma',pk.forma,{cls:'c4',opts:['Pix','Cartão','Dinheiro','Boleto','Transferência','Outro']})}
    ${novo?fld('Nº de parcelas','nparc','1',{type:'number',cls:'c2 keep'})+fld('1º vencimento','venc1',today(),{type:'date',cls:'c2 keep'}).replace('c2 keep','c3 keep'):fld('Status','status',pk.status,{cls:'c4',opts:[['ativo','Ativo'],['encerrado','Encerrado']]})}
    ${novo?'':`${sec('Parcelas')}<div class="f" id="parcs"></div><div class="f"><button type="button" class="btn sm" id="addp">${ic('plus',14)} Parcela</button></div>`}
  </div>`;
  let parcelas = JSON.parse(JSON.stringify(pk.parcelas||[]));
  modal(novo?'Novo pacote':'Pacote', body, { wide:true,
    onOpen: form => {
      const calc = () => { const v = formData(form); $('#tot').value = brl((+v.sessoes||0)*(+v.valorSessao||0) - (+v.desconto||0)); };
      form.addEventListener('input', calc); calc();
      const drawP = () => { if(!$('#parcs')) return; $('#parcs').innerHTML = `<table><thead><tr><th>#</th><th>Vencimento</th><th>Valor</th><th>Pago</th><th>Data pgto.</th><th></th></tr></thead><tbody>${parcelas.map((x,i)=>`<tr data-i="${i}"><td>${i+1}</td><td><input type="date" data-k="venc" value="${h(x.venc)}"></td><td><input type="number" step="0.01" data-k="valor" value="${h(x.valor)}"></td><td><input type="checkbox" data-k="pago" ${x.pago?'checked':''}></td><td><input type="date" data-k="dataPag" value="${h(x.dataPag||'')}"></td><td><button type="button" class="btn ghost sm" data-rp="${i}">${ic('trash',14)}</button></td></tr>`).join('')}</tbody></table>`;
        $$('#parcs input').forEach(inp=>inp.onchange=()=>{ const i = +inp.closest('tr').dataset.i; const k = inp.dataset.k; parcelas[i][k] = inp.type==='checkbox'?inp.checked:inp.value; if(k==='pago' && inp.checked && !parcelas[i].dataPag){ parcelas[i].dataPag = today(); drawP(); } });
        $$('[data-rp]').forEach(b=>b.onclick=()=>{ parcelas.splice(+b.dataset.rp,1); drawP(); }); };
      drawP();
      $('#addp') && ($('#addp').onclick = () => { const last = parcelas[parcelas.length-1]; parcelas.push({n:parcelas.length+1, venc: last?addMonths(last.venc,1):today(), valor: last?.valor||0, pago:false}); drawP(); });
    },
    onSave: async v => {
      if(!v.pacienteId){ toast('Selecione o paciente', true); return false; }

      if(novo){ const n = Math.max(1, +v.nparc||1); const base = Math.floor(total/n*100)/100; d.parcelas = [...Array(n)].map((_,i)=>({n:i+1, venc:addMonths(v.venc1||v.dataInicio,i), valor: i===n-1 ? Math.round((total-base*(n-1))*100)/100 : base, pago:false, dataPag:''})); d.criadoEm = today(); }
      else d.parcelas = parcelas.map((x,i)=>({...x, n:i+1, valor:+x.valor||0}));
      await save('financeiro/'+(pk.id||uid()), d, novo?'Pacote criado':'Pacote atualizado'); rerender();
    },
    danger: novo||!can.admin()?null:{ label:'Excluir pacote', fn: async()=>{ await remove('financeiro/'+pk.id,'Pacote excluído'); rerender(); } } });
}

function tDocumentos(p){
  const pr = protocolo(p.protocoloId); const c = clin(p.id); const ultAv = sortBy(c.avaliacoes.filter(a=>a.status==='concluida'), a=>a.data, true)[0];

    ${can.clinico()?item('d_rel','Relatório de evolução / alta','Resumo do tratamento: presença, evolução da dor, escalas, simetria entre membros, critérios de retorno ao esporte e conclusões — para o paciente ou para o médico.'):''}
    ${can.clinico()?item('d_presc','Ficha de exercícios domiciliares','Exercícios para casa com séries, repetições, carga e links de vídeo.'):''}`;

const boxPaciente = p => `<div class="box2"><b>Paciente:</b> ${h(p.nome)}${idade(p.nascimento)!=null?' — '+idade(p.nascimento)+' anos':''}<br><b>Diagnóstico:</b> ${h(p.diagnostico||'—')}${p.membroLesado?` · Membro lesado: ${h(p.membroLesado)}`:''}${p.medico?`<br><b>Médico:</b> ${h(p.medico)}`:''}${p.dataCirurgia?`<br><b>Cirurgia:</b> ${fmtD(p.dataCirurgia)}`:''}</div>`;
const assinatura = p => { const m = membro(p.fisioId)||S.me; return `<div style="margin-top:40px;text-align:center">_______________________________________<br>${h(m.nome)}${m.crefito?' · CREFITO '+h(m.crefito):''}</div>`; };
function docAvaliacao(p, av){
  return `${docHead(`Avaliação ${av.tipo==='funcional'?'funcional':'clínica'}`, `${fmtD(av.data)} · ${h((membro(av.fisioId)||S.me).nome)}`)}${boxPaciente(p)}${avResumoHTML(av,p)}${assinatura(p)}${docFoot()}`;
}
function docRelatorio(p){
  const c = clin(p.id); const pr = protocolo(p.protocoloId); const fq = frequencia(p.id);
  const realiz = sortBy(sessoes().filter(s=>s.pacienteId===p.id && s.status==='realizada'), s=>s.data); const dor = sortBy(c.dor, d=>d.data);
  const avs = sortBy(c.avaliacoes.filter(a=>a.status==='concluida'), a=>a.data); const ult = avs[avs.length-1];
  const promRows = Object.keys(PROMS).map(k=>{ const r = sortBy(c.proms.filter(x=>x.escala===k), x=>x.data); if(!r.length) return ''; const a=r[0], b=r[r.length-1]; return `<tr><td>${h(PROMS[k].nome)}</td><td class="num">${r1(a.score)} (${fmtD(a.data)})</td><td class="num">${r1(b.score)} (${fmtD(b.data)})</td><td>${PROMS[k].classif?PROMS[k].classif(b.score):''}</td></tr>`; }).join('');
  const condutas = {}; c.evolucoes.forEach(e=>(e.condutas||[]).forEach(x=>condutas[x.n]=(condutas[x.n]||0)+1));
  return `${docHead(p.status==='alta'?'Relatório de alta':'Relatório de evolução', `Emitido em ${fmtD(today())}`)}${boxPaciente(p)}
   <div class="box2"><b>Período:</b> ${realiz.length?fmtD(realiz[0].data)+' a '+fmtD(realiz[realiz.length-1].data):'—'} · <b>${realiz.length} sessões realizadas</b> · presença ${fq.pct!=null?fq.pct+'%':'—'}${pr?`<br><b>Protocolo:</b> ${h(pr.nome)} (${h(pr.fases[p.fase||0]?.nome||'')})`:''}</div>
   ${avs[0]?.dados?.anamnese?.queixa?`<div class="band">Queixa inicial</div><p>${h(avs[0].dados.anamnese.queixa)}</p>`:''}
   ${dor.length?`<div class="band">Evolução da dor (EVA 0–10)</div>${lineChart(dor.map(d=>({l:fmtDs(d.data), v:d.atual, c:evaColor(d.atual)})),{min:0,max:10,height:140})}<p>Início: <b>${dor[0].atual}/10</b> → atual: <b>${dor[dor.length-1].atual}/10</b></p>`:''}
   ${promRows?`<div class="band">Escalas funcionais</div><table><thead><tr><th>Escala</th><th class="num">Inicial</th><th class="num">Atual</th><th>Classificação</th></tr></thead><tbody>${promRows}</tbody></table>`:''}
   ${avs.length?`<div class="band">Simetria entre membros (LSI)</div>${compLSI(p, [...avs].reverse())}`:''}
   ${rtsDados(ult)?.protocolo?`<div class="band">Retorno ao esporte — ${fmtD(ult.data)}</div>${valorTxt(campoDef('rts','rts'), rtsDados(ult), ult, p)}`:''}
   ${Object.keys(condutas).length?`<div class="band">Condutas utilizadas</div><p>${Object.entries(condutas).sort((a,b)=>b[1]-a[1]).map(([n,q])=>`${h(n)} (${q}×)`).join(' · ')}</p>`:''}
   ${ult?.dados?.conclusao?.diagnostico||ult?.dados?.conclusao?.conduta?`<div class="band">Conclusões</div><p style="white-space:pre-wrap">${h([ult.dados.conclusao.diagnostico, ult.dados.conclusao.conduta].filter(Boolean).join('\n\n'))}</p>${ult.dados.conclusao.liberacao?`<p><b>Liberação:</b> ${h(ult.dados.conclusao.liberacao)}</p>`:''}`:''}
   ${assinatura(p)}${docFoot()}`;
}
function docPrescricao(p){
  const c = clin(p.id); const em = exMap(); const l = c.casa;
  return `${docHead('Exercícios para casa', `${h(p.nome)} · ${fmtD(today())}`)}
   ${l.length?`<table><thead><tr><th>#</th><th>Exercício</th><th class="num">Séries</th><th class="num">Reps</th><th>Carga</th><th>Obs. / vídeo</th></tr></thead><tbody>${l.map((x,i)=>{ const e = em[x.exId]; return `<tr><td>${i+1}</td><td><b>${h(e?.nome||x.exId)}</b></td><td class="num">${h(x.series)}</td><td class="num">${h(x.reps)}</td><td>${h(x.carga||'')}</td><td>${h(x.obs||'')}${e?.video?`<br><a href="${h(e.video)}">${h(e.video)}</a>`:''}</td></tr>`; }).join('')}</tbody></table>`:'<p>Nenhum exercício cadastrado.</p>'}
   <div class="box2" style="margin-top:14px">Dor durante o exercício até <b>3/10</b> é aceitável se passar em até 24 h. Se a dor aumentar ou persistir no dia seguinte, avise seu fisioterapeuta.</div>

}

/* ============================ AGENDA ============================ */
async function marcarPresenca(s, status){
  const d = {...s, status}; if(status==='realizada' && !d.checkin) d.checkin = new Date().toTimeString().slice(0,5); if(status!=='realizada') delete d.checkin;
  await save('agenda/'+s.id, d, `${paciente(s.pacienteId)?.nome?.split(' ')[0]||''}: ${STATUS_SESSAO[status]}`);
}
function editSessao(s, preset={}){
  const novo = !s; s = s || { data: preset.data || today(), hora: preset.hora || '08:00', duracao: clinica().duracaoSessao, status:'agendada', ...preset };
  const pacs = sortBy(pacientes().filter(p=>p.status!=='alta' || p.id===s.pacienteId), p=>p.nome.toLowerCase());
  const p = paciente(s.pacienteId);
  const form = modal(novo?'Agendar sessão':'Sessão', `<div class="form">
    ${fld('Paciente','pacienteId',s.pacienteId,{cls:'',opts:[['','Selecione…'],...pacs.map(x=>[x.id,x.nome])]})}
    ${fld('Data','data',s.data,{type:'date',cls:'c4 keep'})}
    ${fld('Hora','hora',s.hora,{type:'time',cls:'c4 keep'})}
    ${fld('Duração (min)','duracao',s.duracao,{type:'number',cls:'c4'})}
    ${fld('Fisioterapeuta','fisioId',s.fisioId,{cls:novo?'':'c6',opts:[['',''],...fisios().map(m=>[m.id,m.nome])]})}
    ${novo?'':fld('Presença','status',s.status,{cls:'c6',opts:Object.entries(STATUS_SESSAO)})}
    ${novo?`${sec('Repetir (pacote)')}<div class="f"><div class="chips">${[1,2,3,4,5,6].map(d=>`<span class="chip" data-tog><input type="checkbox" name="dias" value="${d}" data-multi="1" hidden>${DOW[d]}</span>`).join('')}</div><span class="tiny">Marque os dias da semana para criar sessões recorrentes (ex.: Seg/Qua/Sex). Sem marcar = sessão única.</span></div>${fld('Por quantas semanas','semanas','4',{type:'number',cls:'c4'})}`:''}
    ${fld('Observação','obs',s.obs,{cls:''})}
    ${!novo && s.checkin?`<div class="f tiny">Chegada registrada às ${h(s.checkin)}</div>`:''}
  </div>`, {
    onOpen: f => bindEva(f),
    footer: novo ? undefined : `<button class="btn ghost sm" type="button" id="sdel" title="Excluir sessão">${ic('trash',14)}</button>${p?`<a class="btn" href="#/paciente/${p.id}/sessoes">Paciente</a>`:''}${p?.telefone&&s.status==='agendada'?`<button class="btn" type="button" id="swa">${ic('wpp',14)} Confirmar</button>`:''}<span style="flex:1"></span><button class="btn" type="button" id="sjus">Justificada</button><button class="btn danger" type="button" id="sfal">Falta</button><button class="btn" type="button" id="ssv">Salvar</button>${can.clinico()&&p?`<button class="btn pri" type="button" id="satd">${ic('clip',14)} Presente + atendimento</button>`:`<button class="btn pri" type="button" id="spres">${ic('check',14)} Presente</button>`}`,
    onSave: !novo ? null : async v => {
      if(!v.pacienteId){ toast('Selecione o paciente', true); return false; }
      const base = { pacienteId:v.pacienteId, fisioId:v.fisioId, hora:v.hora, duracao:+v.duracao||60, status:'agendada', obs:v.obs };
      const dias = (v.dias||[]).map(Number);
      if(!dias.length){ await save('agenda/'+uid(), {...base, data:v.data}, 'Sessão agendada'); }
      else {
        const sem = Math.max(1, Math.min(52, +v.semanas||1)); const ws = startOfWeek(v.data); let n=0;
        for(let w=0; w<sem; w++) for(const d of dias){ const dt = addDays(ws, w*7 + (d+6)%7); if(dt < v.data) continue; await save('agenda/'+uid(), {...base, data:dt}); n++; }
        toast(`${n} sessões agendadas`);
      }
      rerender();
    }
  });
  if(!novo){
    const salvar = async (status) => {
      const v = formData(form);
      const d = { ...s, pacienteId:v.pacienteId, data:v.data, hora:v.hora, duracao:+v.duracao||60, fisioId:v.fisioId, obs:v.obs, status: status || v.status };
      if(d.status==='realizada' && !d.checkin) d.checkin = new Date().toTimeString().slice(0,5);
      await save('agenda/'+s.id, d, `Sessão: ${STATUS_SESSAO[d.status]}`); closeModal(); rerender(); return d;
    };
    $('#ssv').onclick = () => salvar();
    $('#sfal').onclick = () => salvar('falta');
    $('#sjus').onclick = () => salvar('justificada');
    $('#spres') && ($('#spres').onclick = () => salvar('realizada'));
    $('#satd') && ($('#satd').onclick = async () => { const d = await salvar('realizada'); editAtendimento(paciente(d.pacienteId), null, {sessaoId:s.id, data:d.data}); });
    $('#swa') && ($('#swa').onclick = () => waAbrir(p.telefone, msgConfirmacao(s)));
    $('#sdel').onclick = async () => { if(confirm('Excluir esta sessão da agenda?')){ await remove('agenda/'+s.id, 'Sessão excluída'); closeModal(); rerender(); } };
  }
}
function vAgenda(){
  const u = S.ui.ag ||= { ws: startOfWeek(today()), fisio: S.me.papel==='fisio' ? S.me.id : '' };
  const days = [...Array(7)].map((_,i)=>addDays(u.ws,i)); const t = today();
  const ss = sessoes().filter(s=>s.data>=days[0] && s.data<=days[6] && (!u.fisio || s.fisioId===u.fisio));
  const fim = parseD(days[6]);
  page('Agenda', `${fmtDs(days[0])} – ${pad(fim.getDate())} ${MES[fim.getMonth()]}`,
    `<select id="agf" style="width:auto"><option value="">Todos os fisios</option>${fisios().map(m=>`<option value="${m.id}" ${u.fisio===m.id?'selected':''}>${h(m.nome)}</option>`).join('')}</select>
     <div class="seg"><button id="agp">${ic('left',14)}</button><button id="agh">Hoje</button><button id="agn">${ic('right',14)}</button></div>
     <button class="btn pri" id="nag">${ic('plus')} Agendar</button>`,
    `<div class="week">${days.map(d=>{ const l = sortBy(ss.filter(s=>s.data===d), s=>s.hora||''); const dd = parseD(d);
      return `<div class="day ${d===t?'today':''}"><div class="dh"><span>${DOW[dd.getDay()]}</span><b>${dd.getDate()}</b></div><div class="slots">
        ${l.map(s=>{ const p = paciente(s.pacienteId); return `<div class="slot ${s.status}" data-s="${s.id}"><b>${h(s.hora||'')} · ${h(p?.nome?.split(' ').slice(0,2).join(' ')||'?')}</b><span class="tiny">${h(nomeFisio(s.fisioId))}${s.status!=='agendada'?' · '+STATUS_SESSAO[s.status]:''}</span></div>`; }).join('')}
        <button class="addday" data-d="${d}">+ sessão</button></div></div>`; }).join('')}</div>
     <div class="tiny" style="margin-top:10px">Clique numa sessão para marcar presença, falta ou falta justificada e registrar o atendimento do dia.</div>`);
  $('#agp').onclick = () => { u.ws = addDays(u.ws,-7); vAgenda(); };
  $('#agn').onclick = () => { u.ws = addDays(u.ws,7); vAgenda(); };
  $('#agh').onclick = () => { u.ws = startOfWeek(today()); vAgenda(); };
  $('#agf').onchange = e => { u.fisio = e.target.value; vAgenda(); };
  $('#nag').onclick = () => editSessao(null, { fisioId: u.fisio || (S.me.papel!=='recepcao'?S.me.id:'') });
  $$('[data-d]').forEach(b=>b.onclick=()=>editSessao(null, {data:b.dataset.d, fisioId:u.fisio || (S.me.papel!=='recepcao'?S.me.id:'')}));
  $$('.slot[data-s]').forEach(el=>el.onclick=()=>editSessao(sessoes().find(s=>s.id===el.dataset.s)));
}

/* ============================ PRESENÇA ============================ */
function vPresenca(tab){
  tab = tab || 'dia'; const u = S.ui.pr ||= { dia: today(), mes: today().slice(0,7), fisio: S.me.papel==='fisio' ? S.me.id : '' };
  const filtroF = s => !u.fisio || s.fisioId===u.fisio;
  const tabs = `<div class="tabs">${[['dia','Chamada do dia'],['mes','Frequência do mês']].map(([k,l])=>`<a href="#/presenca/${k}" class="${k===tab?'on':''}">${l}</a>`).join('')}</div>`;
  const fsel = `<select id="prf" style="width:auto"><option value="">Todos os fisios</option>${fisios().map(m=>`<option value="${m.id}" ${u.fisio===m.id?'selected':''}>${h(m.nome)}</option>`).join('')}</select>`;
  if(tab==='dia'){
    const d = u.dia; const dd = parseD(d);
    const l = sortBy(sessoes().filter(s=>s.data===d && filtroF(s)), s=>s.hora||'');
    const cont = k => l.filter(s=>s.status===k).length;
    page('Controle de presença', `${DOW[dd.getDay()]}, ${fmtD(d)}`, `${fsel}<div class="seg"><button id="pp">${ic('left',14)}</button><button id="ph">Hoje</button><button id="pn">${ic('right',14)}</button></div><input type="date" id="pd" value="${d}" style="width:auto">`,
     `${tabs}<div class="btns" style="margin-bottom:12px">${['agendada','realizada','falta','justificada','cancelada'].map(k=>`<span class="pill ${k==='realizada'?'ok':k==='falta'?'bad':k==='justificada'?'warn':k==='cancelada'?'':'info'}">${STATUS_SESSAO[k]}: ${cont(k)}</span>`).join('')}

function importarExercicios(){
  modal('Importar biblioteca de exercícios', `<p class="small">Aceita <b>JSON</b> (lista de objetos) ou <b>CSV</b> com cabeçalho. Colunas reconhecidas: <code>nome</code>, <code>regiao</code>, <code>categoria</code>, <code>video</code>, <code>obs</code> (também aceita <code>name</code>, <code>region</code>, <code>category</code>, <code>url</code>). Exercícios com o mesmo nome são atualizados, não duplicados.</p>
    <input type="file" id="fimp" accept=".json,.csv,.txt"><div id="impres" class="small" style="margin-top:10px"></div>`,
   { saveLabel:'Importar', onOpen: () => { S.ui.imp = null; $('#fimp').onchange = async ev => { const f = ev.target.files[0]; if(!f) return; const txt = await f.text(); try{ S.ui.imp = parseImport(txt, f.name); $('#impres').innerHTML = `<span class="pill ok">${S.ui.imp.length} exercícios lidos</span> Ex.: ${h(S.ui.imp.slice(0,3).map(x=>x.nome).join(', '))}`; }catch(err){ $('#impres').innerHTML = `<span class="pill bad">Erro: ${h(err.message)}</span>`; } }; },
     onSave: async () => { const novos = S.ui.imp; if(!novos?.length){ toast('Escolha um arquivo válido', true); return false; }
       const byName = new Map(exercicios().map(x=>[x.nome.toLowerCase(), x])); const custom = new Map((get('config/exercicios')?.itens||[]).map(x=>[x.id,x])); let add=0, upd=0;
       novos.forEach(n=>{ const ex = byName.get(n.nome.toLowerCase()); if(ex){ const o = {...(custom.get(ex.id)||{id:ex.id})}; Object.keys(n).forEach(k=>{ if(n[k]) o[k]=n[k]; }); custom.set(ex.id, o); upd++; } else { const it = {id:uid(), regiao:'', categoria:'', video:'', obs:'', ...n}; custom.set(it.id, it); byName.set(n.nome.toLowerCase(), it); add++; } });
       await save('config/exercicios', {itens:[...custom.values()]}, `${add} novos · ${upd} atualizados`); rerender(); } });
}
function parseImport(txt, fname){
  const norm = o => { const g = (...ks) => { for(const k of ks){ const f = Object.keys(o).find(x=>x.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')===k); if(f && o[f]!=null && o[f]!=='') return String(o[f]).trim(); } return ''; };
    return { nome:g('nome','name','exercicio','exercise','titulo','title'), regiao:g('regiao','region','area','segmento'), categoria:g('categoria','category','tipo','type'), video:g('video','url','link','youtube'), obs:g('obs','observacao','notes','descricao') }; };
  let rows;
  if(/\.json$/i.test(fname) || /^\s*[\[{]/.test(txt)){ let j = JSON.parse(txt); if(!Array.isArray(j)) j = j.itens || j.exercicios || j.exercises || Object.values(j); rows = j; }
  else {
    const sep = (txt.split('\n')[0].match(/;/g)||[]).length > (txt.split('\n')[0].match(/,/g)||[]).length ? ';' : ',';
    const parseLine = line => { const out=[]; let cur='', q=false; for(let i=0;i<line.length;i++){ const ch=line[i]; if(ch==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; } else if(ch===sep&&!q){ out.push(cur); cur=''; } else cur+=ch; } out.push(cur); return out; };
    const lines = txt.replace(/\r/g,'').split('\n').filter(l=>l.trim()); const head = parseLine(lines[0]);
    rows = lines.slice(1).map(l=>{ const v = parseLine(l); const o={}; head.forEach((k,i)=>o[k.trim()]=v[i]); return o; });
  }
  const out = rows.map(norm).filter(x=>x.nome);
  if(!out.length) throw new Error('nenhuma linha com "nome" encontrada');
  return out;
}
